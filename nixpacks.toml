# Nixpacks configuration for Dokploy
[phases.setup]
nixPkgs = ["nodejs_20", "chromium", "fontconfig", "freefont-ttf"]

[phases.install]
cmds = ["npm install"]

[start]
cmd = "npm start"

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/run/current-system/sw/bin/chromium"
PORT = "5000"
